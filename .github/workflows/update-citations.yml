name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # Scheduled workflows run from the default branch (main), while the
      # published site source lives on master. Always update the published branch.
      - name: Checkout published site source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install citation updater dependencies
        run: python -m pip install pyyaml scholarly

      - name: Fetch Google Scholar citations
        shell: bash
        run: |
          set +e
          timeout 5m python -u bin/update_scholar_citations.py
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "Google Scholar citation update failed with exit code $status."
            echo "Google Scholar citation update failed with exit code $status." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

          echo "Google Scholar citation data updated successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated citation data
        id: commit
        shell: bash
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add _data/citations.yml

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Citation counts have not changed." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Update Google Scholar citations"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updated citation counts were pushed to master." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy updated badges
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
